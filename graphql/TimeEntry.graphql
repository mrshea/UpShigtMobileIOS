# TimeEntry.graphql - Operations for time tracking

mutation ClockIn($shiftId: ID, $latitude: Float, $longitude: Float) {
  clockIn(shiftId: $shiftId, latitude: $latitude, longitude: $longitude) {
    id
    shiftId
    clerkId
    clockInTime
    clockOutTime
    shift {
      id
      date
      startTime
      endTime
      departmentId
      department {
        id
        name
        description
        orgId
      }
      peopleNeeded
      availableSpots
    }
  }
}

mutation ClockOut($latitude: Float, $longitude: Float) {
  clockOut(latitude: $latitude, longitude: $longitude) {
    id
    shiftId
    clerkId
    clockInTime
    clockOutTime
    shift {
      id
      date
      startTime
      endTime
      departmentId
      department {
        id
        name
        description
        orgId
      }
    }
  }
}

query GetMyTimeEntries($startDate: DateTime, $endDate: DateTime) {
  myTimeEntries(startDate: $startDate, endDate: $endDate) {
    id
    shiftId
    clerkId
    clockInTime
    clockOutTime
    shift {
      id
      date
      startTime
      endTime
      departmentId
      department {
        id
        name
        description
        orgId
      }
      peopleNeeded
      availableSpots
    }
  }
}

query GetClockStatus {
  clockStatus {
    isClockedIn
    activeEntry {
      id
      shiftId
      clerkId
      clockInTime
      clockOutTime
      shift {
        id
        date
        startTime
        endTime
        departmentId
        department {
          id
          name
          description
          orgId
        }
      }
    }
  }
}
